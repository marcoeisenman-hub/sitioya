<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Reels SitioYa</title>
<style>
@font-face{font-family:DM;src:url(DMSans.ttf) format("truetype");font-weight:100 1000}
:root{--bg:#FFF6EC;--blush:#FFE3DC;--coral:#FF6B5B;--coral-d:#E2503F;--navy:#1B2A4A;--mint:#7ED6C1;--soft:#5B6680;--yel:#FFD36B;--wa:#1FA855}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:DM,system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.blob{border-radius:50%;filter:blur(2px)}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:44px;letter-spacing:-.02em}
.brand b{color:var(--coral)}
.handle{font-weight:800;font-size:36px;color:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 34px;border-radius:999px;font-weight:900;font-size:40px;letter-spacing:.06em;white-space:nowrap}
.h{font-weight:900;letter-spacing:-.045em;line-height:.98;white-space:nowrap}
.w{display:inline-block;will-change:transform,opacity}
/* teléfono */
.phone{background:#141D33;border-radius:78px;padding:16px;box-shadow:0 60px 110px -40px rgba(27,42,74,.55),0 0 0 3px #2A3A5E inset}
.screen{position:relative;width:100%;height:100%;border-radius:62px;overflow:hidden;background:#fff}
.island{position:absolute;left:50%;top:20px;width:150px;height:42px;margin-left:-75px;background:#0B1020;border-radius:30px;z-index:50}
.screen iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
/* chat e inbox */
.sb{height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 44px 14px;font-weight:700;font-size:26px;color:#111}
.sbi{display:flex;gap:8px;align-items:center}
.row{position:absolute;left:0;right:0;height:132px;display:flex;align-items:center;gap:22px;padding:0 30px;background:#fff}
.av{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:36px}
.row .tx{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:29px;color:#111}
.row .ms{font-size:27px;color:#111;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:22px;color:#8a8f99;font-weight:600}
.dot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--coral)}
.bub{position:absolute;max-width:76%;padding:20px 26px;border-radius:30px;font-size:29px;line-height:1.3;font-weight:600}
.bub.in{left:26px;background:#F0F1F4;color:#111;border-bottom-left-radius:10px}
.bub.out{right:26px;background:var(--navy);color:#fff;border-bottom-right-radius:10px}
.bub.wa{right:26px;background:#D9FDD3;color:#111;border-bottom-right-radius:10px}
.sticker{padding:26px 44px;border-radius:44px;background:#fff;font-weight:900;font-size:66px;letter-spacing:-.03em;box-shadow:0 30px 60px -20px rgba(27,42,74,.35);white-space:nowrap}
.chip{display:flex;align-items:center;gap:16px;padding:20px 30px 20px 22px;border-radius:28px;background:#fff;font-weight:800;font-size:38px;box-shadow:0 24px 50px -18px rgba(27,42,74,.35);white-space:nowrap}
.ck{flex:none;width:50px;height:50px;border-radius:50%;background:var(--mint);display:grid;place-items:center}
/* subtítulos */
#subs{position:absolute;left:40px;right:40px;top:1508px;height:120px;display:flex;justify-content:center;align-items:center;pointer-events:none}
#subs .ln{display:inline-flex;flex-wrap:nowrap;gap:0 16px;padding:14px 34px 18px;border-radius:30px;background:var(--navy);color:#fff;font-weight:900;font-size:62px;letter-spacing:-.02em;white-space:nowrap;box-shadow:0 20px 40px -18px rgba(27,42,74,.6)}
#subs .ln span{transition:none}
.note{font-size:28px;font-weight:600;color:var(--soft)}
</style></head>
<body><div id="st"></div>
<script>
"use strict";
/* ---------- utilidades ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const spr = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(11 * x) * (1 - x) - 0 * x;
const lerp = (a, b, x) => a + (b - a) * x;
const kf = (t, ks, ease = eio) => { // ks: [[t, v], ...]
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) { const [t0, v0] = ks[i - 1], [t1, v1] = ks[i]; return lerp(v0, v1, ease((t - t0) / (t1 - t0))); }
  return ks[ks.length - 1][1];
};
function mk(tag, cls, parent, html, css) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html;
  if (css) Object.assign(e.style, css); (parent || ST).appendChild(e); return e;
}
function tf(e, { x = 0, y = 0, s = 1, r = 0, o = 1, sx, sy }) {
  e.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${(sx ?? s).toFixed(4)},${(sy ?? s).toFixed(4)})`;
  e.style.opacity = cl(o).toFixed(3); e.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
const ST = document.getElementById("st");
const LISTOS = [];
const EV = []; // sonidos: {s, t, v}
const sfx = (s, t, v = 1) => { if (t >= 0) EV.push({ s, t: +t.toFixed(3), v }); };
const LOGO = s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="26" fill="#FF6B5B"/><rect x="16" y="20" width="60" height="47" rx="7" fill="#FFF6EC" stroke="#1B2A4A" stroke-width="6"/><path d="M16 33H76" stroke="#1B2A4A" stroke-width="6"/><circle cx="22.5" cy="25.5" r="1.6" fill="#1B2A4A"/><path d="M25 44.5H45M25 56H37" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round"/><path d="M54 46L54 84L63.5 74.5L70 88L76.5 85L70 71.5L83.5 71.5Z" fill="#1B2A4A" stroke="#FF6B5B" stroke-width="9" stroke-linejoin="round" paint-order="stroke"/></svg>`;
const CHECK = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const PLANE = c => `<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M21 3l-11 10"/></svg>`;
const CHAT = (c, s = 40) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4.3 21l4-1.8c1.2.4 2.4.6 3.7.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>`;
const STATUS = (c = "#111") => `<div class="sb" style="color:${c}"><span>9:41</span><span class="sbi"><svg width="34" height="22" viewBox="0 0 34 22"><rect x="0" y="14" width="6" height="8" rx="1.5" fill="${c}"/><rect x="9" y="9" width="6" height="13" rx="1.5" fill="${c}"/><rect x="18" y="4" width="6" height="18" rx="1.5" fill="${c}"/><rect x="27" y="0" width="6" height="22" rx="1.5" fill="${c}"/></svg><svg width="46" height="24" viewBox="0 0 46 24"><rect x="1" y="1" width="38" height="22" rx="6" fill="none" stroke="${c}" stroke-width="2" opacity=".5"/><rect x="4" y="4" width="28" height="16" rx="3.5" fill="${c}"/><rect x="41" y="8" width="3" height="8" rx="1.5" fill="${c}" opacity=".5"/></svg></span></div>`;

/* ---------- piezas comunes ---------- */
let TL, SC, HIDE_SUBS = [];
const sc = id => SC[id];
function wt(id, word, n = 0) { // tiempo en que se dice una palabra dentro de una escena
  const norm = s => s.toLowerCase().replace(/[^\wáéíóúñü$]/g, "");
  const ws = SC[id].lineas.flatMap(l => l.subs); let k = 0;
  for (const w of ws) if (norm(w.w) === norm(word) && k++ === n) return w.t;
  throw new Error(`palabra "${word}" no está en ${id}`);
}

function fondo(colores) {
  const bl = colores.map(([c, s, x, y]) => ({ e: mk("div", "a blob", ST, null, { width: s + "px", height: s + "px", background: c }), x, y, s }));
  return t => bl.forEach((b, i) => tf(b.e, { x: b.x + Math.sin(t * .35 + i * 2) * 26, y: b.y + Math.cos(t * .3 + i) * 22 }));
}
function marca() {
  const e = mk("div", "a brand", ST, LOGO(64) + "<span>Sitio<b>Ya</b></span>");
  const h = mk("div", "a handle", ST, "@sitioya.pty");
  return (t, o) => { tf(e, { x: 70, y: 92, o }); tf(h, { x: 1010 - h.offsetWidth, y: 104, o }); };
}

function telefono(w, h, parent = ST) {
  const el = mk("div", "a phone", parent, null, { width: w + "px", height: h + "px" });
  const scr = mk("div", "screen", el); mk("div", "island", scr);
  return { el, scr, w, h, sw: w - 32, sh: h - 32 };
}
function pagina(ph, nombre) { // la página de ejemplo real dentro del teléfono
  const k = ph.sw / 390;
  const f = mk("iframe", "", ph.scr, null, { width: "390px", height: (ph.sh / k) + "px", transform: `scale(${k})` });
  f.src = `/plantillas/${nombre}.html`;
  const listo = new Promise(r => f.addEventListener("load", async () => {
    const d = f.contentDocument;
    const s = d.createElement("style");
    s.textContent = "*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.fade,.rv{opacity:1!important;transform:none!important}html{scrollbar-width:none}::-webkit-scrollbar{display:none}";
    d.head.appendChild(s);
    for (const i of d.images) i.loading = "eager";
    await Promise.race([Promise.all([...d.images].map(i => i.complete ? 0 : new Promise(q => { i.onload = i.onerror = q; }))), new Promise(q => setTimeout(q, 8000))]);
    await d.fonts.ready; r();
  }, { once: true }));
  LISTOS.push(listo);
  return { f, k, listo, scroll: y => { f.contentWindow.scrollTo(0, Math.round(y)); }, rect: sel => { const e = f.contentDocument.querySelector(sel); const r = e.getBoundingClientRect(); return { x: r.left * k, y: r.top * k, w: r.width * k, h: r.height * k }; } };
}
function toque(parent) { // dedo que toca: círculo con onda
  const e = mk("div", "a", parent, null, { width: "90px", height: "90px", marginLeft: "-45px", marginTop: "-45px", borderRadius: "50%", background: "rgba(27,42,74,.28)", border: "5px solid rgba(255,255,255,.9)", zIndex: 60 });
  const o = mk("div", "a", parent, null, { width: "90px", height: "90px", marginLeft: "-45px", marginTop: "-45px", borderRadius: "50%", border: "5px solid rgba(27,42,74,.5)", zIndex: 60 });
  return (t, t0, x, y, x0 = x + 60, y0 = y + 160) => {
    const a = P(t, t0 - .55, .5), b = P(t, t0, .45);
    const vis = t > t0 - .55 && t < t0 + .6;
    tf(e, { x: lerp(x0, x, eo(a)), y: lerp(y0, y, eo(a)), s: t < t0 ? 1 : 1 - .25 * Math.sin(b * Math.PI), o: vis ? cl(a * 3) * (1 - P(t, t0 + .3, .3)) : 0 });
    tf(o, { x, y, s: 1 + b * 1.4, o: t >= t0 && t < t0 + .45 ? 1 - b : 0 });
  };
}
// subtítulos por bloques de pocas palabras, la palabra que suena en coral
function subtitulos() {
  const box = mk("div", "", ST); box.id = "subs";
  const bloques = [];
  for (const e of TL.escenas) {
    if (HIDE_SUBS.includes(e.id)) continue;
    for (const l of e.lineas) {
      let cur = [];
      const fin = l.t + l.d;
      const cierra = () => { if (cur.length) bloques.push({ ws: cur, fin }); cur = []; };
      l.subs.forEach((w, i) => {
        const largo = cur.reduce((a, x) => a + x.w.length + 1, 0) + w.w.length;
        if (cur.length && (largo > 24 || cur.length >= 4)) cierra();
        cur.push(w);
        if (/[.?!,:]$/.test(w.w) && cur.length >= 2) cierra();
      });
      cierra();
    }
  }
  bloques.forEach((b, i) => { b.a = b.ws[0].t - .06; const sig = bloques[i + 1]; b.b = sig && sig.ws[0].t - .06 < b.fin + .5 ? sig.ws[0].t - .06 : b.fin + .25; });
  let actual = null, ln = null, spans = [];
  return t => {
    const b = bloques.find(x => t >= x.a && t < x.b);
    if (b !== actual) {
      box.innerHTML = ""; actual = b; spans = [];
      if (b) { ln = mk("div", "ln", box); spans = b.ws.map(w => mk("span", "", ln, w.w.replace(/&/g, "&amp;").replace(/</g, "&lt;"))); }
    }
    if (!b) return;
    const p = P(t, b.a, .22);
    ln.style.transform = `translateY(${(1 - eo(p)) * 26}px) scale(${.92 + .08 * back(p)})`; ln.style.opacity = cl(p * 2.5) * (1 - P(t, b.b - .08, .08));
    let cur = -1; b.ws.forEach((w, i) => { if (t >= w.t - .04) cur = i; });
    spans.forEach((s, i) => { s.style.color = i === cur ? "#FF6B5B" : i < cur ? "#fff" : "rgba(255,255,255,.55)"; });
  };
}
// palabras que entran al ritmo de la voz
function palabras(parent, html, x, y, size, color = "var(--navy)") {
  const e = mk("div", "a h", parent, null, { fontSize: size + "px", color });
  const ws = html.map(([txt, extra]) => { const s = mk("span", "w", e, txt, extra ? { color: extra } : null); mk("span", "", e, " "); return s; });
  return { e, ws, upd: (t, tiempos, o = 1) => { tf(e, { x, y, o }); ws.forEach((s, i) => { const p = spr(P(t, tiempos[i] - .05, .55)); s.style.transform = `translateY(${(1 - p) * 90}px) rotate(${(1 - p) * 6}deg)`; s.style.opacity = cl(P(t, tiempos[i] - .05, .15)); }); } };
}
// cierre: logo, precio y DM
function cierre(id, lineas) {
  const S = sc(id), t0 = S.t;
  const g = mk("div", "a", ST, null, { width: "1080px", height: "1920px" });
  const halo = mk("div", "a blob", g, null, { width: "760px", height: "760px", background: "var(--blush)", left: "160px", top: "180px" });
  const lg = mk("div", "a", g, LOGO(230), { left: "425px", top: "330px" });
  const nm = mk("div", "a brand", g, "<span>Sitio<b>Ya</b></span>", { fontSize: "110px", left: "0", width: "1080px", justifyContent: "center", top: "590px" });
  const confe = [...Array(16)].map((_, i) => mk("div", "a", g, null, { width: (14 + (i % 3) * 8) + "px", height: (14 + (i % 3) * 8) + "px", borderRadius: i % 4 ? "50%" : "6px", background: ["#FF6B5B", "#7ED6C1", "#FFD36B", "#1B2A4A"][i % 4], left: "540px", top: "445px" }));
  const L = lineas.map(l => ({ ...l, e: mk("div", "a", g, l.html, Object.assign({ left: "0", width: "1080px", textAlign: "center", top: l.y + "px" }, l.css || {})) }));
  const dm = mk("div", "a pill", g, PLANE("#fff") + "@sitioya.pty", { background: "var(--coral)", color: "#fff", fontSize: "62px", letterSpacing: "-.01em", padding: "26px 54px", fontWeight: "900" });
  const tq = toque(g);
  const tDM = L.find(l => l.dm).at;
  sfx("whoosh", t0 - .15, .9); sfx("pop", t0 + .2, 1); sfx("sparkle", t0 + .25, .6);
  L.forEach(l => sfx("pop", l.at, .7)); sfx("pop", tDM + .35, .8); sfx("tap", tDM + 1.35, 1);
  return t => {
    const on = t >= t0 - .3; g.style.display = on ? "block" : "none"; if (!on) return;
    const p = spr(P(t, t0 + .15, .8));
    tf(halo, { s: .6 + .4 * eo(P(t, t0, .8)) + Math.sin(t * 1.4) * .02, o: .9 });
    tf(lg, { s: p, r: (1 - p) * -25, y: Math.sin((t - t0) * 2) * 8 });
    tf(nm, { y: (1 - eo(P(t, t0 + .35, .5))) * 60, o: P(t, t0 + .35, .3) });
    confe.forEach((c, i) => { const a = i / 16 * Math.PI * 2 + .3, q = eo(P(t, t0 + .2, 1.1)); tf(c, { x: Math.cos(a) * 330 * q, y: Math.sin(a) * 300 * q + q * q * 90, r: q * 300, o: 1 - P(t, t0 + .8, .5) }); });
    L.forEach(l => { const q = spr(P(t, l.at - .05, .6)); tf(l.e, { y: (1 - q) * 70, s: .9 + .1 * q, o: cl(P(t, l.at - .05, .18)) }); });
    const q = spr(P(t, tDM + .3, .6));
    const cx = 540 - dm.offsetWidth / 2, cy = 1250;
    const press = t > tDM + 1.35 && t < tDM + 1.6 ? .94 : 1;
    tf(dm, { x: cx, y: cy + (1 - q) * 80, s: (.85 + .15 * q) * press, o: cl(P(t, tDM + .3, .15)) });
    tq(t, tDM + 1.35, 540 + dm.offsetWidth * .28, cy + 60);
  };
}
// transición: barrido coral
function barrido(t0, forma = "circulo") {
  const e = mk("div", "a", ST, null, { width: "1080px", height: "1920px", background: "var(--coral)", zIndex: 90 });
  const lg = mk("div", "a", e, LOGO(170), { left: "455px", top: "875px" });
  sfx("whoosh", t0 - .35, 1);
  return t => {
    const a = P(t, t0 - .35, .35), b = P(t, t0 + .05, .4);
    if (t < t0 - .35 || b >= 1) { e.style.visibility = "hidden"; return; }
    e.style.visibility = "visible";
    e.style.clipPath = `circle(${(eio(a) * 1150).toFixed(1)}px at 540px 960px)`;
    e.style.transform = `translateY(${(-eio(b) * 1920).toFixed(1)}px)`;
    tf(lg, { s: .5 + .5 * eo(a), o: a, r: (1 - a) * -30 });
  };
}

/* =========================================================
   1) ANTES Y DESPUÉS
   ========================================================= */
function v1() {
  HIDE_SUBS = ["gancho", "cierre"];
  const bg = fondo([["#FFE3DC", 620, 620, 1240], ["#D9F3EC", 520, -200, 80]]);
  const br = marca();
  const G = sc("gancho"), A = sc("antes"), D = sc("despues"), C = sc("cierre");
  // gancho
  const h1 = palabras(ST, [["¿Sigues"]], 80, 290, 160);
  const h1b = palabras(ST, [["vendiendo"]], 80, 450, 160);
  const h2 = palabras(ST, [["solo"], ["por"], ["DM?", "var(--coral)"]], 80, 610, 160);
  const und = mk("div", "a", ST, `<svg width="350" height="40" viewBox="0 0 330 40"><path d="M6 28C80 10 200 6 324 20" stroke="#FF6B5B" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360"/></svg>`);
  const undP = und.querySelector("path");
  const tG = [wt("gancho", "¿Sigues"), wt("gancho", "vendiendo"), wt("gancho", "solo"), wt("gancho", "por"), wt("gancho", "DM?")];
  tG.forEach(x => sfx("pop", x, .45));
  // etiquetas
  const pa = mk("div", "a pill", ST, "ANTES", { background: "var(--navy)", color: "#fff" });
  const pd = mk("div", "a pill", ST, "DESPUÉS", { background: "var(--mint)", color: "var(--navy)" });
  const sub1 = mk("div", "a h", ST, "Solo por DM", { fontSize: "64px" });
  const sub2 = mk("div", "a h", ST, "Con tu página", { fontSize: "64px" });
  // teléfono con mensajes
  const ph = telefono(600, 1150);
  const inbox = mk("div", "", ph.scr, null, { position: "absolute", inset: "0", background: "#fff" });
  inbox.innerHTML = STATUS() + `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 30px 18px"><div style="font-weight:900;font-size:46px;color:#111;letter-spacing:-.02em">Mensajes</div><div class="cnt" style="min-width:64px;height:54px;padding:0 16px;border-radius:30px;background:#FF6B5B;color:#fff;font-weight:900;font-size:30px;display:grid;place-items:center">0</div></div><div style="margin:0 30px 14px;height:62px;border-radius:20px;background:#F0F1F4;color:#8a8f99;font-size:27px;font-weight:600;display:flex;align-items:center;padding:0 24px">Buscar</div>`;
  const cnt = inbox.querySelector(".cnt");
  const lista = mk("div", "", inbox, null, { position: "absolute", left: "0", right: "0", top: "262px", bottom: "0", overflow: "hidden" });
  const MSG = [
    ["Ana", "¿Precio?"], ["Luis", "Buenas, ¿a qué hora abren?"], ["Yari", "¿Dónde están ubicados?"], ["Kathy", "info porfa"],

    ch1.forEach(c => { const q = spr(P(t, c.t - .05, .6)), o = P(t, S2.t - .35, .25); tf(c.e, { x: c.x + (1 - q) * -80 - o * 100, y: c.y, s: .6 + .4 * q, o: cl(P(t, c.t - .05, .12)) * (1 - o) }); });
    // paso 2
    const v2on = t >= S2.t;
    esq.style.visibility = v2on && t < tMed + 1.2 ? "visible" : "hidden";
    const rev = eio(P(t, tMed, 1.0));
    pg.f.style.visibility = v2on ? "visible" : "hidden";
    pg.f.style.clipPath = t < S3.t ? `inset(0 0 ${(100 - rev * 100).toFixed(2)}% 0)` : "none";
    tf(shine, { y: rev * ph.sh - 80, o: rev > 0 && rev < 1 ? 1 : 0 });
    const esqP = cl((t - S2.t) / .5);
    esq.querySelectorAll("div").forEach((d, i) => { const q = eo(P(t, S2.t + .1 + i * .12, .4)); d.style.transform = `translateX(${(1 - q) * -40}px)`; d.style.opacity = q * (.6 + .4 * Math.sin(t * 6 + i) ** 2); });
    if (v2on && t < S3.t) pg.scroll(kf(t, [[S2.t + 3.3, 0], [S2.t + S2.d, 520]]));
    const p2o = P(t, S3.t - .35, .25);
    const qp1 = spr(P(t, tCol - .05, .6)); tf(pal, { x: 20 + (1 - qp1) * -60 - p2o * 100, y: 840, r: -4 * qp1, s: .6 + .4 * qp1, o: cl(P(t, tCol - .05, .12)) * (1 - p2o) });
    const qp2 = spr(P(t, tEst - .05, .6)); tf(fnt, { x: 820 + (1 - qp2) * 60 + p2o * 100, y: 1020, r: 4 * qp2, s: .6 + .4 * qp2, o: cl(P(t, tEst - .05, .12)) * (1 - p2o) });
    const qp3 = spr(P(t, tMed + .2, .6)); tf(logoChip, { x: 760 + (1 - qp3) * 60 + p2o * 100, y: 700, r: 3 * qp3, s: .6 + .4 * qp3, o: cl(P(t, tMed + .2, .12)) * (1 - p2o) });
    // paso 3
    if (t >= S3.t) {
      pg.scroll(kf(t, [[S3.t, 520], [S3.t + .6, 1330]]));
      if (!addRect) { const b = [...pg.f.contentDocument.querySelectorAll(".btn.sm")][0]; const r = b.getBoundingClientRect(); addRect = { x: (r.left + r.width / 2) * pg.k, y: (r.top + r.height / 2) * pg.k }; }
      const tqT = t < tTap1 + .7 ? tTap1 : tTap2;
      const pos = t < tTap1 + .7 ? addRect : { x: ph.sw - 105, y: ph.sh - 105 };
      tq(t, tqT, pos.x, pos.y);
      const sl = eio(P(t, tTap2 + .12, .45));
      wa.style.transform = `translateX(${((1 - sl) * 100).toFixed(2)}%)`;
      const q = spr(P(t, tTap2 + .75, .5)); tf(ped, { y: (1 - q) * 50, s: .85 + .15 * q, o: cl(P(t, tTap2 + .75, .1)) });
    }
    notifs.forEach((nn, i) => { const q = spr(P(t, nn.t, .55)); const k = notifs.filter((m, j) => j > i && t > m.t).length; tf(nn.e, { x: 220, y: 1180 - k * 135 + (1 - q) * -60, s: (1 - k * .04) * (.8 + .2 * q), o: cl(P(t, nn.t, .12)) * (1 - P(t, C.t - .35, .25)) * (k > 2 ? 0 : 1) }); nn.e.style.zIndex = 70 + i; });
    tf(nota, { x: 540 - nota.offsetWidth / 2, y: 1648, o: t >= S2.t + .3 && t < C.t - .3 ? 1 : 0 });
    fin(t); subs(t);
  };
}

/* =========================================================
   3) TU NEGOCIO EN INTERNET, YA

function v3() {
  HIDE_SUBS = ["gancho", "cierre"];
  const bg = fondo([["#D9F3EC", 560, -220, 1380], ["#FFE3DC", 700, 560, 560]]);
  const br = marca();
  const G = sc("gancho"), C = sc("cierre");
  const PS = ["p1", "p2", "p3", "p4"].map(sc);
  // gancho estilo post
  const kick = mk("div", "a pill", ST, "PÁGINAS WEB PARA NEGOCIOS", { background: "var(--coral)", color: "var(--navy)", fontSize: "38px" });
  const h1 = palabras(ST, [["Tu"], ["negocio"]], 76, 470, 168);
  const h2 = palabras(ST, [["en"], ["internet,"]], 76, 640, 168);
  const h3 = palabras(ST, [["ya.", "var(--coral)"]], 76, 810, 168);
  const tG = ["Tu", "negocio", "en", "internet,", "ya."].map(w => wt("gancho", w));
  tG.forEach((x, i) => sfx(i === 4 ? "thud" : "pop", x, i === 4 ? 1 : .45));
  const lead = mk("div", "a", ST, "Hecha a tu medida, en Panamá.", { fontSize: "52px", fontWeight: "700", color: "var(--soft)", letterSpacing: "-.01em" });
  // ejemplos
  const pill = mk("div", "a pill", ST, "", { background: "var(--coral)", color: "var(--navy)", fontSize: "34px", padding: "12px 28px" });
  const nombres = PS.map(s => mk("div", "a h", ST, s.nombre, { fontSize: "112px" }));
  const ph = telefono(540, 1070);
  const PH_X = 270, PH_Y = 440;
  const carril = mk("div", "", ph.scr, null, { position: "absolute", left: "0", top: "0", height: "100%", width: (ph.sw * 4) + "px" });
  const pgs = PS.map((s, i) => { const holder = mk("div", "", carril, null, { position: "absolute", left: (i * ph.sw) + "px", top: "0", width: ph.sw + "px", height: ph.sh + "px", overflow: "hidden" }); const p = pagina({ scr: holder, sw: ph.sw, sh: ph.sh }, s.pagina); return p; });
  const halo = mk("div", "a blob", ST, null, { width: "820px", height: "820px", left: "130px", top: "560px", background: "#FFE3DC" });
  ST.insertBefore(halo, ph.el);
  const HALO = ["#FFE3DC", "#E7E2F7", "#FFE9C2", "#D9F3EC"];
  PS.forEach((s, i) => { if (i) sfx("whoosh", s.t - .15, .8); sfx("pop", s.t + .1, .6); });
  const nota = mk("div", "a note", ST, "Negocios y datos de ejemplo");
  const fin = cierre("cierre", [
    { html: `<div class="h" style="font-size:112px">Escríbenos por DM</div>`, at: wt("cierre", "Escríbenos"), y: 800, dm: true },
    { html: `<div style="font-size:60px;font-weight:700;color:var(--soft)">y armamos la tuya</div>`, at: wt("cierre", "armamos"), y: 950 },
    { html: `<span class="pill" style="background:var(--navy);color:#fff;font-size:50px;letter-spacing:0">Básica desde $99</span>`, at: wt("cierre", "tuya.") + .2, y: 1070 },
  ]);
  const subs = subtitulos();
  const P1 = PS[0];
  return t => {
    bg(t); br(t, 1 - P(t, C.t - .2, .3));
    const sal = eio(P(t, P1.t - .3, .4));
    const qk = spr(P(t, .05, .6));
    tf(kick, { x: 76, y: 300 + (1 - qk) * -40 - sal * 200, o: cl(qk * 2) * (1 - sal) });
    h1.upd(t, tG.slice(0, 2), 1 - sal); h2.upd(t, tG.slice(2, 4), 1 - sal); h3.upd(t, tG.slice(4), 1 - sal);
    [h1, h2, h3].forEach(h => h.e.style.marginTop = (-sal * 200) + "px");
    tf(lead, { x: 80, y: 1010 + (1 - eo(P(t, tG[4] + .2, .5))) * 40 - sal * 200, o: P(t, tG[4] + .2, .3) * (1 - sal) });
    // teléfono: asoma en el gancho y luego al centro
    const asoma = spr(P(t, tG[4] - .2, .8)), centro = eio(P(t, P1.t - .35, .6)), sale = eio(P(t, C.t - .4, .45));
    const x = lerp(PH_X + 330, PH_X, centro), y = lerp(PH_Y + 760 + (1 - asoma) * 600, PH_Y, centro) + sale * 1900;
    tf(ph.el, { x, y, r: lerp(-9, 0, centro) + sale * 10, o: t > tG[4] - .25 ? 1 : 0 });
    tf(halo, { x: lerp(330, 0, centro), y: lerp(640, 0, centro) + sale * 1900, s: .8 + .2 * asoma + Math.sin(t * 1.3) * .02, o: t > tG[4] - .25 ? 1 : 0 });
    // qué página toca
    let cur = 0; PS.forEach((s, i) => { if (t >= s.t - .2) cur = i; });
    const sw = PS.map((s, i) => eio(P(t, s.t - .2, .45)));
    const off = sw.slice(1).reduce((a, b) => a + b, 0);
    carril.style.transform = `translateX(${(-off * ph.sw).toFixed(1)}px)`;
    pgs.forEach((p, i) => { const s = PS[i]; p.scroll(kf(t, [[s.t + .4, 0], [s.t + s.d - .2, 1250]])); });
    const mixH = (a, b, k) => { const h = c => [1, 3, 5].map(j => parseInt(c.slice(j, j + 2), 16)); const A = h(a), B = h(b); return `rgb(${A.map((v, j) => Math.round(lerp(v, B[j], k))).join(",")})`; };
    halo.style.background = cur > 0 ? mixH(HALO[cur - 1], HALO[cur], sw[cur]) : HALO[0];
    const vis = t >= P1.t - .05 && t < C.t - .3;
    pill.textContent = `EJEMPLO ${cur + 1} DE 4`;
    const qpl = spr(P(t, PS[cur].t - .1, .5));
    tf(pill, { x: 80, y: 196, s: .9 + .1 * qpl, o: vis ? 1 : 0 });
    nombres.forEach((e, i) => { const s = PS[i]; const a = spr(P(t, s.t - .1, .55)), b = eio(P(t, s.t + s.d - .2, .3)); tf(e, { x: 80, y: 278 + (1 - a) * 80 - b * 80, o: (i === PS.length - 1 ? cl(P(t, s.t - .1, .15)) * (1 - P(t, C.t - .35, .2)) : cl(P(t, s.t - .1, .15)) * (1 - b)) }); });
    tf(nota, { x: 540 - nota.offsetWidth / 2, y: 1648, o: vis && t >= P1.t + .2 ? 1 : 0 });
    fin(t); subs(t);
  };
}
